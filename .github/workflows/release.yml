name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

jobs:
  build-desktop:
    name: Build desktop ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-22.04
          - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Copy gradle.properties
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cp .github/gradle.properties ~/.gradle/gradle.properties

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build desktop
        run: ./gradlew packageReleaseDistributionForCurrentOS

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            shared/build/compose/binaries/main-release/deb/*.deb
            shared/build/compose/binaries/main-release/dmg/*.dmg
            shared/build/compose/binaries/main-release/msi/*.msi

  build-android:
    name: Build android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Copy gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/gradle.properties ~/.gradle/gradle.properties

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Setup android
        uses: android-actions/setup-android@v4

      - name: Decode keystore
        run: |
          printf "%s" "${{ secrets.KEYSTORE }}" | base64 -d > android/clock-of-clocks.jks
          printf "%s" "${{ secrets.KEYSTORE_PROPERTIES }}" | base64 -d > android/keystore.properties

      - name: Build android
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            android/build/outputs/apk/release/*.apk
            android/build/outputs/bundle/release/*.aab

  create-release:
    name: Create github release
    needs:
      - build-desktop
      - build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List file
        run: ls -R

      - name: Create release
        run: >
          gh release create ${{ github.ref_name }}
          artifacts/**/*.{aab,apk,deb,dmg,msi} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
